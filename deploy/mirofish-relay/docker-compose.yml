services:
  mirofish:
    build:
      context: ../..
      dockerfile: deploy/mirofish-relay/Dockerfile
    container_name: mirofish-relay
    # Docker's init (tini) as PID 1 reaps the mihomo + relay child processes.
    init: true
    ports:
      # Public exposure requested. Anyone who can reach this port needs the
      # local proxy key; put TLS + extra auth in front for production.
      - "0.0.0.0:8787:8787"
    environment:
      # 必填：加密 secrets.enc 的主密钥，至少 16 字符。生产建议用 secret 文件。
      MIROFISH_MASTER_KEY: ${MIROFISH_MASTER_KEY:?set MIROFISH_MASTER_KEY (>=16 chars)}
      # 可选：默认账号别名
      MIROFISH_DEFAULT_ACCOUNT: ${MIROFISH_DEFAULT_ACCOUNT:-}
      # OpenAI 兼容请求未提供 model 时使用；按当前上游实际可用模型覆盖。
      MIROFISH_DEFAULT_MODEL: ${MIROFISH_DEFAULT_MODEL:-gpt-5.6-luna}
      # 官方 auth / relay 地址及客户端协议指纹；保留为环境变量以便上游迁移时无代码切换。
      MIROFISH_AUTH_BASE: ${MIROFISH_AUTH_BASE:-https://auth.mirasim.ai}
      MIROFISH_RELAY_BASE: ${MIROFISH_RELAY_BASE:-https://relay.mirasim.ai}
      MIROFISH_MIRASIM_CLIENT_VERSION: ${MIROFISH_MIRASIM_CLIENT_VERSION:-0.0.228}
      MIROFISH_MIRASIM_LOCALE: ${MIROFISH_MIRASIM_LOCALE:-zh-HK}
      MIROFISH_SESSION_TTL: ${MIROFISH_SESSION_TTL:-1800}
      MIROFISH_KEEPALIVE_EXPIRY: ${MIROFISH_KEEPALIVE_EXPIRY:-75}
      MIROFISH_MAX_CONNECTIONS: ${MIROFISH_MAX_CONNECTIONS:-100}
      MIROFISH_MAX_KEEPALIVE_CONNECTIONS: ${MIROFISH_MAX_KEEPALIVE_CONNECTIONS:-20}
      MIROFISH_STREAM_READ_TIMEOUT: ${MIROFISH_STREAM_READ_TIMEOUT:-600}
      MIROFISH_MAX_BODY_BYTES: ${MIROFISH_MAX_BODY_BYTES:-8388608}
      # 代理订阅：远程 URL 或挂载到 /input 的本地文件，二选一；留空则纯直连（不启动 mihomo）。
      MIROFISH_PROXY_SUBSCRIPTION_URL: ${MIROFISH_PROXY_SUBSCRIPTION_URL:-}
      MIROFISH_PROXY_SUBSCRIPTION_FILE: ${MIROFISH_PROXY_SUBSCRIPTION_FILE:-}
      MIROFISH_PROXY_REFRESH_SECONDS: ${MIROFISH_PROXY_REFRESH_SECONDS:-600}
      MIROFISH_PROXY_FETCH_TIMEOUT: ${MIROFISH_PROXY_FETCH_TIMEOUT:-10}
      MIROFISH_PROXY_SUBSCRIPTION_USER_AGENT: ${MIROFISH_PROXY_SUBSCRIPTION_USER_AGENT:-mihomo/1.19.0}
      MIROFISH_PROXY_FAILURE_THRESHOLD: ${MIROFISH_PROXY_FAILURE_THRESHOLD:-2}
      # 可选：按名称排除节点（正则，如 香港|HK|🇭🇰）；命中的节点完全不进入池。
      MIROFISH_PROXY_NODE_EXCLUDE: ${MIROFISH_PROXY_NODE_EXCLUDE:-}
      # Controller/proxy endpoints are wired to loopback by the entrypoint; the
      # engine now lives in this same container.
      MIROFISH_MIHOMO_CONTROLLER_TIMEOUT: ${MIROFISH_MIHOMO_CONTROLLER_TIMEOUT:-5}
      MIROFISH_MIHOMO_SELECTOR: ${MIROFISH_MIHOMO_SELECTOR:-MirofishPool}
      MIROFISH_MIHOMO_PROVIDER: ${MIROFISH_MIHOMO_PROVIDER:-mirofish}
      # 每个账号独立出口的槽位数量与起始端口（并发能力）。
      MIROFISH_MIHOMO_SLOTS: ${MIROFISH_MIHOMO_SLOTS:-8}
      MIROFISH_MIHOMO_SLOT_BASE_PORT: ${MIROFISH_MIHOMO_SLOT_BASE_PORT:-7891}
    volumes:
      - mirofish-data:/data
      # Optional static subscription source (MIROFISH_PROXY_SUBSCRIPTION_FILE=/input/...).
      - ./mihomo-input:/input:ro
    restart: unless-stopped

volumes:
  mirofish-data:
