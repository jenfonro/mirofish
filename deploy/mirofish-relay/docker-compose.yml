services:
  mirofish:
    build:
      context: ../..
      dockerfile: deploy/mirofish-relay/Dockerfile
    container_name: mirofish-relay
    # Docker's init (tini) as PID 1 reaps the relay process cleanly.
    init: true
    # Ship logs to the host journal instead of the container's own json-file.
    # The default driver writes inside the container directory, so every
    # `docker compose up -d` that recreates the container destroys the log with
    # it — and an upstream verdict like "temporarily suspended ... access
    # resumes at <ISO>" is only ever stated once, in that log. The journal
    # outlives the container, is already rotated by systemd (the json-file
    # default is not: container logs here had grown to ~99 MB), and is
    # greppable per unit via CONTAINER_NAME.
    logging:
      driver: journald
      options:
        tag: mirofish-relay
    ports:
      # Public exposure requested. Anyone who can reach this port needs the
      # local proxy key; put TLS + extra auth in front for production.
      - "0.0.0.0:8787:8787"
    environment:
      # 必填：加密 secrets.enc 的主密钥，至少 16 字符。生产建议用 secret 文件。
      MIROFISH_MASTER_KEY: ${MIROFISH_MASTER_KEY:?set MIROFISH_MASTER_KEY (>=16 chars)}
      # 可选：默认账号别名
      MIROFISH_DEFAULT_ACCOUNT: ${MIROFISH_DEFAULT_ACCOUNT:-}
      # OpenAI 兼容请求未提供 model 时使用；按当前上游实际可用模型覆盖。
      MIROFISH_DEFAULT_MODEL: ${MIROFISH_DEFAULT_MODEL:-gpt-5.6-luna}
      # 官方 auth / relay 地址及客户端协议指纹；保留为环境变量以便上游迁移时无代码切换。
      MIROFISH_AUTH_BASE: ${MIROFISH_AUTH_BASE:-https://auth.mirasim.ai}
      MIROFISH_RELAY_BASE: ${MIROFISH_RELAY_BASE:-https://relay.mirasim.ai}
      MIROFISH_MIRASIM_CLIENT_VERSION: ${MIROFISH_MIRASIM_CLIENT_VERSION:-0.0.272}
      MIROFISH_MIRASIM_LOCALE: ${MIROFISH_MIRASIM_LOCALE:-zh-HK}
      MIROFISH_CODEX_USER_AGENT: ${MIROFISH_CODEX_USER_AGENT:-mirasim/0.150.1 (Mac OS 26.6.2; x86_64) Apple_Terminal/470.2 (mirasim; 0.1.0)}
      MIROFISH_MIRASIM_SEAL_PUBLIC_KEY: ${MIROFISH_MIRASIM_SEAL_PUBLIC_KEY:-HlyNMMeGXryasYLJuYQ/9ksCD4AYVVy1zXKAtJdpJn4=}
      MIROFISH_MIRASIM_SEAL_METADATA: ${MIROFISH_MIRASIM_SEAL_METADATA:-1}
      MIROFISH_SESSION_TTL: ${MIROFISH_SESSION_TTL:-1800}
      # 自动调度在窗口用到多少时停止选这个账号（0.10–1.0）。低于 1.0 是刻意
      # 留余量：撞上游的拒绝本身才是封号诱因。稳定后再往上调。
      MIROFISH_QUOTA_CEILING: ${MIROFISH_QUOTA_CEILING:-0.90}
      # 额度缓存有效期（秒）。没有轮询：只有刚服务过请求的那个账号在缓存过期
      # 后才重读，遇 429 则强制重读一次。
      MIROFISH_LIMITS_TTL: ${MIROFISH_LIMITS_TTL:-600}
      MIROFISH_KEEPALIVE_EXPIRY: ${MIROFISH_KEEPALIVE_EXPIRY:-75}
      MIROFISH_MAX_CONNECTIONS: ${MIROFISH_MAX_CONNECTIONS:-100}
      MIROFISH_MAX_KEEPALIVE_CONNECTIONS: ${MIROFISH_MAX_KEEPALIVE_CONNECTIONS:-20}
      MIROFISH_STREAM_READ_TIMEOUT: ${MIROFISH_STREAM_READ_TIMEOUT:-600}
      MIROFISH_MAX_BODY_BYTES: ${MIROFISH_MAX_BODY_BYTES:-8388608}
      # 节点连续失败多少次后离开轮换。节点由面板手动维护，没有订阅可刷。
      MIROFISH_PROXY_FAILURE_THRESHOLD: ${MIROFISH_PROXY_FAILURE_THRESHOLD:-2}
    volumes:
      - mirofish-data:/data
    restart: unless-stopped

volumes:
  mirofish-data:
