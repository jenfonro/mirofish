[project]
name = "mirofish-relay"
version = "2.0.0"
description = "Multi-account Mirofish Anthropic-compatible relay with a built-in WebUI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx[socks]>=0.27",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.scripts]
mirofish = "mirofish.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirofish"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
