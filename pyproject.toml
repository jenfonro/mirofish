[project]
name = "mirofish-relay"
version = "2.0.0"
description = "Multi-account Mirofish Anthropic-compatible relay with a built-in WebUI"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx[brotli,socks,zstd]>=0.27",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.scripts]
mirofish = "mirofish.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirofish"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "**/.claude",
    "/captures",
    "**/captures",
    "/flows",
    "**/flows",
    "*.flow",
    "**/*.flow",
    "*.flows",
    "**/*.flows",
    "*.mitm",
    "**/*.mitm",
    "*.mitmproxy",
    "**/*.mitmproxy",
    "*.mitmweb",
    "**/*.mitmweb",
    "*.har",
    "**/*.har",
    "*.pcap",
    "**/*.pcap",
    "*.pcapng",
    "**/*.pcapng",
    ".env",
    "**/.env",
    "*.enc",
    "**/*.enc",
    "proxy.key",
    "**/proxy.key",
    "/deploy/mirofish-relay/mihomo-input",
    "/deploy/mirofish-relay/mihomo-input/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
